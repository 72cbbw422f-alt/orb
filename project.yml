name: ORBIT
options:
  bundleIdPrefix: app.orbit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: ORBIT
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  ORBIT:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Features
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.orbit.reader
    scheme:
      testTargets:
        - ORBITTests
  ORBITTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ORBITTests
    dependencies:
      - target: ORBIT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.orbit.reader.tests
