name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep one active run per branch. A newer pending run replaces an older pending
# run, but does not cancel a build that is already executing.
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available simulators
        run: xcrun simctl list devices available

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ORBIT.xcodeproj \
            -scheme ORBIT \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests
        run: |
          DEVICE_ID="$(xcrun simctl list devices available | grep -m 1 -Eo '[A-F0-9-]{36}' || true)"
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iOS simulator found."
            exit 1
          fi
          xcodebuild \
            -project ORBIT.xcodeproj \
            -scheme ORBIT \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test

  package-unsigned-ipa:
    needs: build-and-test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive unsigned iOS app
        run: |
          xcodebuild \
            -project ORBIT.xcodeproj \
            -scheme ORBIT \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/ORBIT.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned IPA for FlareStore
        run: |
          mkdir -p build/ipa/Payload
          ditto build/ORBIT.xcarchive/Products/Applications/ORBIT.app build/ipa/Payload/ORBIT.app
          cd build/ipa
          zip -qry ORBIT-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-unsigned-IPA
          path: build/ipa/ORBIT-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
